# Scenarios are data, not code. Adding a case means editing this file.
#
# `bearing_sigma_px` is what the filter is TOLD the centroid noise is.
# `noise.bearing_sigma` is what is actually injected (radians). Keeping them
# consistent is what makes NEES meaningful; deliberately mismatching them is how
# you test what happens when the noise model is wrong.
scenarios:
  - name: clean_lateral
    description: >
      Well-conditioned baseline. The camera strafes across its own view
      direction, so every object gets real perpendicular baseline. This is the
      case the system should be good at, and the reference all others degrade from.
    source: synthetic
    seeds: 20
    bearing_sigma_px: 2.0
    synthetic: {path: lateral, n_frames: 40, speed_mps: 5.0}
    noise: {bearing_sigma: 0.00158}

  - name: forward_motion
    description: >
      The degenerate case, and the common one for a vehicle. Motion is straight
      ahead, so objects near the optical axis have almost no perpendicular
      baseline and range is close to unobservable. The system is not expected to
      geolocate these well -- it is expected to KNOW that it cannot.
    source: synthetic
    seeds: 20
    bearing_sigma_px: 2.0
    synthetic: {path: straight, n_frames: 40, speed_mps: 5.0}
    noise: {bearing_sigma: 0.00158}

  - name: arc_sweep
    description: A turning camera, which sweeps bearing continuously.
    source: synthetic
    seeds: 20
    bearing_sigma_px: 2.0
    synthetic: {path: arc, n_frames: 40, speed_mps: 5.0, arc_radius_m: 40.0}
    noise: {bearing_sigma: 0.00158}

  - name: gps_degraded
    description: >
      Urban GPS: metre-level position noise on the camera centre. Note this is
      WHITE per-frame noise, which is pessimistic -- real GPS error is strongly
      correlated frame to frame, and its correlated part is better modelled by
      gps_bias. White noise of this size is comparable to the camera's own
      per-frame motion, so it corrupts the baseline itself. That is an
      errors-in-variables problem: the triangulator sees an inflated apparent
      baseline and becomes overconfident, which shows up here as a failed NEES
      check rather than as a mere accuracy loss.
    source: synthetic
    seeds: 20
    bearing_sigma_px: 2.0
    synthetic: {path: lateral, n_frames: 40}
    noise: {bearing_sigma: 0.00158, gps_sigma: 2.0}

  - name: heading_bias
    description: >
      A constant 2-degree yaw error. The nastiest failure mode in the set: it is
      not in the filter's covariance, so the filter cannot see it and NEES should
      blow up. Included precisely because it is the case where the system is
      wrong AND confident.
    source: synthetic
    seeds: 20
    bearing_sigma_px: 2.0
    synthetic: {path: lateral, n_frames: 40}
    noise: {bearing_sigma: 0.00158, heading_bias: 0.0349}

  - name: cluttered
    description: Dropouts and false positives, to exercise association and track management.
    source: synthetic
    seeds: 20
    bearing_sigma_px: 2.0
    synthetic: {path: lateral, n_frames: 40}
    noise:
      bearing_sigma: 0.00158
      detection_dropout: 0.25
      false_positive_rate: 0.5

  - name: with_ranger
    description: Same as clean_lateral but with triangulation ranging on the middle loop.
    source: synthetic
    seeds: 20
    bearing_sigma_px: 2.0
    use_ranger: true
    range_every_n: 3
    synthetic: {path: lateral, n_frames: 40}
    noise: {bearing_sigma: 0.00158}
