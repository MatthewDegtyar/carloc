# One axis at a time. A full factorial over six knobs is thousands of runs and a
# plot nobody reads; what earns its keep is an error-vs-noise curve per knob.
sweeps:
  - name: bearing_noise
    scenario: clean_lateral
    seeds: 12
    axes:
      bearing_sigma: [0.0, 0.0008, 0.00158, 0.003, 0.006, 0.012]

  - name: gps_noise
    scenario: clean_lateral
    seeds: 12
    axes:
      gps_sigma: [0.0, 0.5, 1.0, 2.0, 5.0, 10.0]

  - name: heading_bias
    scenario: clean_lateral
    seeds: 12
    axes:
      heading_bias: [0.0, 0.0087, 0.0175, 0.0349, 0.0698]

  - name: heading_noise
    scenario: clean_lateral
    seeds: 12
    axes:
      heading_sigma: [0.0, 0.0044, 0.0087, 0.0175, 0.0349]

  - name: dropout
    scenario: clean_lateral
    seeds: 12
    axes:
      detection_dropout: [0.0, 0.1, 0.25, 0.5, 0.75]

  - name: false_positives
    scenario: clean_lateral
    seeds: 12
    axes:
      false_positive_rate: [0.0, 0.25, 0.5, 1.0, 2.0]
