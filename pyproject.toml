[project]
name = "carloc"
version = "0.1.0"
description = "Every car in a drone scene, once, with a real lat/lon"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26", "pillow>=10.0"]

[project.optional-dependencies]
# CoreML ships compiled extensions only up to 3.13. The numpy<2 pin that used to
# sit here belongs to *conversion*, not inference: running an exported .mlpackage
# is fine under numpy 2 (verified, coremltools 9.0 / numpy 2.5.2).
detect = ["coremltools>=8.0"]
plot = ["matplotlib>=3.7"]

[project.scripts]
carloc = "carloc.cli:main"

[dependency-groups]
dev = ["pytest>=7.4", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["carloc"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
