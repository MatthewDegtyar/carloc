[project]
name = "carloc"
version = "0.1.0"
description = "Geolocated parked cars, with timestamps, from dashcam video — plateless"
readme = "README.md"
requires-python = ">=3.11,<3.14"
# Core install is light: the geometry (Trajectory, geolocate) and types work with
# just these. The detector and video decoding are the `detect` extra.
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# Everything needed to go from a video file to parked cars: the detector
# (RF-DETR, runs locally, no key), OpenCV for tracking/optical-flow, Pillow.
# ffmpeg must be on PATH for frame extraction.
detect = [
    "rfdetr>=1.9",
    "opencv-python>=4.9",
    "pillow>=10.0",
]
plot = ["matplotlib>=3.7"]

[project.scripts]
carloc = "carloc.cli:main"

[dependency-groups]
dev = ["pytest>=7.4", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["carloc"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
